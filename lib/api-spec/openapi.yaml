openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Portfolio API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: Portfolio owner profile
  - name: projects
    description: Portfolio projects
  - name: timeline
    description: Career timeline entries
  - name: messages
    description: Contact messages
  - name: analytics
    description: Site analytics
  - name: ai
    description: AI assistant
  - name: chat
    description: Public visitor chat widget (Mistral -> Qwen -> DeepSeek relay)
  - name: security
    description: Security alerts and intrusion attempts
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the portfolio owner profile
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Update the portfolio owner profile (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - name: featured
          in: query
          schema:
            type: boolean
        - name: technology
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    put:
      operationId: updateProject
      tags: [projects]
      summary: Update a project (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/featured:
    get:
      operationId: getFeaturedProjects
      tags: [projects]
      summary: Get featured projects for hero display
      responses:
        "200":
          description: Featured projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

  /timeline:
    get:
      operationId: listTimeline
      tags: [timeline]
      summary: List all timeline/experience entries
      responses:
        "200":
          description: Timeline entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEntry"
    post:
      operationId: createTimelineEntry
      tags: [timeline]
      summary: Create a new timeline entry (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTimelineEntryBody"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineEntry"

  /timeline/{id}:
    put:
      operationId: updateTimelineEntry
      tags: [timeline]
      summary: Update a timeline entry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTimelineEntryBody"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineEntry"
    delete:
      operationId: deleteTimelineEntry
      tags: [timeline]
      summary: Delete a timeline entry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List all messages (admin only)
      parameters:
        - name: read
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a contact message (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /messages/{id}/read:
    patch:
      operationId: markMessageRead
      tags: [messages]
      summary: Mark a message as read (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /analytics/track:
    post:
      operationId: trackPageView
      tags: [analytics]
      summary: Track a page view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackPageViewBody"
      responses:
        "200":
          description: Tracked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /analytics/dashboard:
    get:
      operationId: getAnalyticsDashboard
      tags: [analytics]
      summary: Get analytics dashboard summary (admin only)
      responses:
        "200":
          description: Dashboard analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsDashboard"

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat with AI admin assistant (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatBody"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"

  /ai/analyze-message/{id}:
    get:
      operationId: analyzeMessage
      tags: [ai]
      summary: Analyze a contact message with AI (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageAnalysis"

  /ai/dashboard-summary:
    get:
      operationId: getAiDashboardSummary
      tags: [ai]
      summary: AI-generated summary of dashboard stats (admin only)
      responses:
        "200":
          description: AI dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"

  /ai/suggest-project:
    post:
      operationId: suggestProject
      tags: [ai]
      summary: AI-generated suggestions for a new/existing project (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectSuggestionBody"
      responses:
        "200":
          description: AI project suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSuggestion"

  /ai/suggest-timeline:
    post:
      operationId: suggestTimelineEntry
      tags: [ai]
      summary: AI-generated suggestions for a new/existing timeline entry (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineSuggestionBody"
      responses:
        "200":
          description: AI timeline suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineSuggestion"

  /chat/history/{visitorId}:
    get:
      operationId: getChatHistory
      tags: [chat]
      summary: Get chat history for a visitor
      parameters:
        - name: visitorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"

  /chat/message:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the visitor chat widget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageBody"
      responses:
        "200":
          description: AI reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"

  /security/log-attempt:
    post:
      operationId: logSecurityAttempt
      tags: [security]
      summary: Log an unauthorized access attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogAttemptBody"
      responses:
        "201":
          description: Attempt logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityAlert"

  /security/alerts:
    get:
      operationId: listSecurityAlerts
      tags: [security]
      summary: List all security alerts (admin only)
      responses:
        "200":
          description: List of security alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityAlert"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Profile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        title:
          type: string
        bio:
          type: string
        photoUrl:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        githubUrl:
          type: string
          nullable: true
        linkedinUrl:
          type: string
          nullable: true
        cvUrl:
          type: string
          nullable: true
        skills:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - title
        - bio
        - skills
        - updatedAt

    UpdateProfileBody:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        bio:
          type: string
        photoUrl:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        githubUrl:
          type: string
          nullable: true
        linkedinUrl:
          type: string
          nullable: true
        cvUrl:
          type: string
          nullable: true
        skills:
          type: array
          items:
            type: string

    Project:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        longDescription:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        technologies:
          type: array
          items:
            type: string
        category:
          type: string
        githubUrl:
          type: string
          nullable: true
        demoUrl:
          type: string
          nullable: true
        featured:
          type: boolean
        order:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - technologies
        - category
        - featured
        - order
        - createdAt

    CreateProjectBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        longDescription:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        technologies:
          type: array
          items:
            type: string
        category:
          type: string
        githubUrl:
          type: string
          nullable: true
        demoUrl:
          type: string
          nullable: true
        featured:
          type: boolean
        order:
          type: integer
      required:
        - title
        - description
        - technologies
        - category

    UpdateProjectBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        longDescription:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        technologies:
          type: array
          items:
            type: string
        category:
          type: string
        githubUrl:
          type: string
          nullable: true
        demoUrl:
          type: string
          nullable: true
        featured:
          type: boolean
        order:
          type: integer

    TimelineEntry:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        organization:
          type: string
        description:
          type: string
        startDate:
          type: string
        endDate:
          type: string
          nullable: true
        current:
          type: boolean
        type:
          type: string
          enum: [education, work, achievement]
        order:
          type: integer
      required:
        - id
        - title
        - organization
        - description
        - startDate
        - current
        - type
        - order

    CreateTimelineEntryBody:
      type: object
      properties:
        title:
          type: string
        organization:
          type: string
        description:
          type: string
        startDate:
          type: string
        endDate:
          type: string
          nullable: true
        current:
          type: boolean
        type:
          type: string
          enum: [education, work, achievement]
        order:
          type: integer
      required:
        - title
        - organization
        - description
        - startDate
        - current
        - type

    UpdateTimelineEntryBody:
      type: object
      properties:
        title:
          type: string
        organization:
          type: string
        description:
          type: string
        startDate:
          type: string
        endDate:
          type: string
          nullable: true
        current:
          type: boolean
        type:
          type: string
          enum: [education, work, achievement]
        order:
          type: integer

    Message:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        subject:
          type: string
          nullable: true
        content:
          type: string
        read:
          type: boolean
        aiSummary:
          type: string
          nullable: true
        aiIntent:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - content
        - read
        - createdAt

    SendMessageBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        subject:
          type: string
          nullable: true
        content:
          type: string
      required:
        - name
        - email
        - content

    TrackPageViewBody:
      type: object
      properties:
        page:
          type: string
        referrer:
          type: string
          nullable: true
      required:
        - page

    AnalyticsDashboard:
      type: object
      properties:
        totalViews:
          type: integer
        uniqueVisitors:
          type: integer
        unreadMessages:
          type: integer
        totalMessages:
          type: integer
        totalProjects:
          type: integer
        topPages:
          type: array
          items:
            type: object
            properties:
              page:
                type: string
              views:
                type: integer
            required:
              - page
              - views
        viewsByDay:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              views:
                type: integer
            required:
              - date
              - views
      required:
        - totalViews
        - uniqueVisitors
        - unreadMessages
        - totalMessages
        - totalProjects
        - topPages
        - viewsByDay

    AiChatBody:
      type: object
      properties:
        message:
          type: string
        history:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
            required:
              - role
              - content
      required:
        - message

    AiChatResponse:
      type: object
      properties:
        reply:
          type: string
      required:
        - reply

    ChatMessageBody:
      type: object
      properties:
        visitorId:
          type: string
        message:
          type: string
      required:
        - visitorId
        - message

    ChatHistoryResponse:
      type: array
      items:
        type: object
        properties:
          role:
            type: string
            enum: [user, assistant]
          content:
            type: string
          createdAt:
            type: string
        required:
          - role
          - content
          - createdAt

    MessageAnalysis:
      type: object
      properties:
        summary:
          type: string
        intent:
          type: string
        suggestedReply:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
      required:
        - summary
        - intent
        - suggestedReply
        - priority

    ProjectSuggestionBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        technologies:
          type: string

    ProjectSuggestion:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        longDescription:
          type: string
        category:
          type: string
        technologies:
          type: string
      required:
        - title
        - description
        - longDescription
        - category
        - technologies

    TimelineSuggestionBody:
      type: object
      properties:
        title:
          type: string
        organization:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [work, education, achievement]

    TimelineSuggestion:
      type: object
      properties:
        title:
          type: string
        organization:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [work, education, achievement]
      required:
        - title
        - organization
        - description
        - type

    SecurityAlert:
      type: object
      properties:
        id:
          type: integer
        attemptedEmail:
          type: string
        attemptedPassword:
          type: string
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - attemptedEmail
        - attemptedPassword
        - createdAt

    LogAttemptBody:
      type: object
      properties:
        attemptedEmail:
          type: string
        attemptedPassword:
          type: string
      required:
        - attemptedEmail
        - attemptedPassword
